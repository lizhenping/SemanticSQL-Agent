# Prompt configuration for NL2SQL Pipeline

prompts:
  # Analysis prompts (8 steps)
  
  initial_domain_analysis:
    type: chat
    system: analysis/domain_expert_system.j2
    human: analysis/initial_domain_human.j2
    variables:
      - database_name
      - table_count
      - table_names
      
  field_classification:
    type: chat
    system: analysis/field_classifier_system.j2
    human: analysis/field_classification_human.j2
    variables:
      - table_name
      - columns
      - domain_context
      
  generate_column_description:
    type: chat
    system: analysis/column_expert_system.j2
    human: analysis/column_description_human.j2
    variables:
      - table_name
      - column_name
      - column_type
      - field_category
      - domain_context
      
  correct_column_descriptions:
    type: chat
    system: analysis/correction_expert_system.j2
    human: analysis/column_correction_human.j2
    variables:
      - original_descriptions
      - field_classifications
      - domain_context
      
  generate_table_description:
    type: chat
    system: analysis/table_expert_system.j2
    human: analysis/table_description_human.j2
    variables:
      - table_name
      - column_descriptions
      - domain_context
      
  refine_domain_knowledge:
    type: chat
    system: analysis/domain_refiner_system.j2
    human: analysis/domain_refinement_human.j2
    variables:
      - initial_domain
      - table_descriptions
      - field_classifications
      - column_descriptions
      
  analyze_logical_relations:
    type: chat
    system: analysis/er_expert_system.j2
    human: analysis/logical_relations_human.j2
    variables:
      - physical_relations
      - domain_context
      - table_descriptions
      
  build_conceptual_model:
    type: chat
    system: analysis/conceptual_expert_system.j2
    human: analysis/conceptual_model_human.j2
    variables:
      - logical_relations
      - domain_knowledge
      - business_entities
      
  # Generation prompts
  
  table_mapping:
    type: chat
    system: generation/mapping_expert_system.j2
    human: generation/table_mapping_human.j2
    variables:
      - scenario_description
      - complexity_level
      - available_tables
      - domain_context
      
  capability_refinement:
    type: chat
    system: generation/capability_expert_system.j2
    human: generation/capability_refinement_human.j2
    variables:
      - scenario
      - complexity
      - table_mappings
      
  field_mapping:
    type: chat
    system: generation/field_mapper_system.j2
    human: generation/field_mapping_human.j2
    variables:
      - sub_scenario
      - capabilities
      - table_context
      - available_fields
      
  question_generation:
    type: chat
    system: generation/question_generator_system.j2
    human: generation/question_generation_human.j2
    variables:
      - scenario
      - complexity
      - field_mappings
      - capabilities
      - examples