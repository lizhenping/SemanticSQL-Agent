      - "计算项目完成率"
      - "关联项目和负责人信息"
    complex:
      - "识别高风险项目"
      - "多维度项目分析"
      - "项目状态变化追踪"
    expert:
      - "项目执行效率排名"
      - "同比环比分析"
      - "项目依赖关系分析"
      
  项目地理分布:
