# 表列分析规则 - 根据场景和复杂度确定需要的表和操作

# 场景到表的映射规则
scenario_table_mapping:
  project_execution_monitoring:
    contract_fulfillment:
      # 核心表（必需）
      core_tables:
        - pattern: "contract|合同"
          priority: 1
          typical_columns:
            - pattern: "status|状态"
              operations: ["WHERE", "GROUP BY", "CASE WHEN"]
            - pattern: "completion|完成"
              operations: ["计算字段", "聚合函数"]
            - pattern: "date|日期"
              operations: ["日期函数", "范围查询"]
      
      # 关联表（根据复杂度可选）
      related_tables:
        - pattern: "milestone|里程碑"
          min_complexity: 2  # 中等复杂度以上才使用
          join_conditions: ["contract_id", "project_id"]
        - pattern: "payment|支付"
          min_complexity: 3  # 复杂查询以上
          join_conditions: ["contract_id"]
      
    lifecycle_management:
      core_tables:
        - pattern: "project|项目"
          priority: 1
        - pattern: "phase|阶段"
          priority: 2
      related_tables:
        - pattern: "transition|转换"
          min_complexity: 2

  project_geographical_distribution:
    regional_distribution:
      core_tables:
        - pattern: "project|项目"
          priority: 1
        - pattern: "region|区域|地区"
          priority: 1
          typical_columns:
            - pattern: "province|省"
              operations: ["GROUP BY", "WHERE"]
            - pattern: "city|市"
              operations: ["GROUP BY", "WHERE"]
      related_tables:
        - pattern: "organization|承制单位"
          min_complexity: 2

# 列类型到操作的映射
column_type_operations:
  # 数值类型
  numeric:
    patterns: ["amount|金额", "count|数量", "rate|率", "percentage|百分"]
    basic_operations:
      - "比较运算: >, <, ="
      - "范围查询: BETWEEN"
    aggregate_operations:
      - "SUM: 求和"
      - "AVG: 平均值"
      - "MAX/MIN: 最大最小值"
    advanced_operations:
      - "计算字段: 四则运算"
      - "CASE WHEN: 分段统计"
      - "窗口函数: 排名、累计"
  
  # 日期类型
  date:
    patterns: ["date|日期", "time|时间", "created|创建", "updated|更新"]
    basic_operations:
      - "日期比较: >, <, ="
      - "日期范围: BETWEEN"
    function_operations:
      - "YEAR/MONTH: 提取年月"
      - "DATE_FORMAT: 格式化"
      - "DATEDIFF: 计算天数差"
    advanced_operations:
      - "日期分组: GROUP BY YEAR/MONTH"
      - "时间窗口: 最近N天"
      - "同比环比: LAG/LEAD"
  
  # 分类/状态类型
  categorical:
    patterns: ["status|状态", "type|类型", "category|类别", "level|级别"]
    basic_operations:
      - "等值过滤: = 'value'"
      - "IN查询: IN (value1, value2)"
    aggregate_operations:
      - "COUNT: 分类计数"
      - "GROUP BY: 分组统计"
    advanced_operations:
      - "CASE WHEN: 状态映射"
      - "透视分析: 行转列"
  
  # 文本类型
  text:
    patterns: ["name|名称", "description|描述", "code|编码"]
    basic_operations:
      - "模糊查询: LIKE '%keyword%'"
      - "精确匹配: = 'value'"
    function_operations:
      - "字符串函数: CONCAT, SUBSTRING"
      - "长度判断: LENGTH"
    advanced_operations:
      - "正则匹配: REGEXP"
      - "全文搜索: MATCH AGAINST"

# 复杂度与操作的映射
complexity_operation_rules:
  simple:
    allowed_operations:
      - "基础WHERE条件"
      - "简单排序ORDER BY"
      - "限制结果LIMIT"
    table_limit: 1
    join_allowed: false
    
  moderate:
    allowed_operations:
      - "表连接JOIN"
      - "分组GROUP BY"
      - "基础聚合函数"
      - "HAVING过滤"
    table_limit: 3
    join_allowed: true
    max_joins: 2
    
  complex:
    allowed_operations:
      - "子查询"
      - "CASE WHEN条件逻辑"
      - "集合操作UNION"
      - "复杂聚合"
    table_limit: 5
    join_allowed: true
    max_joins: 4
    
  expert:
    allowed_operations:
      - "窗口函数"
      - "CTE公共表表达式"
      - "递归查询"
      - "高级分析函数"
    table_limit: null
    join_allowed: true
    max_joins: null