# 日志配置文件

version: 1
disable_existing_loggers: false

# 格式化器
formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  simple:
    format: '%(levelname)s - %(message)s'

# 处理器
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/nl2sql_pipeline.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/nl2sql_pipeline_error.log
    maxBytes: 5242880  # 5MB
    backupCount: 3
    encoding: utf8

# 日志记录器
loggers:
  # 根日志记录器
  '':
    level: INFO
    handlers: [console, file]
  
  # 应用程序日志记录器
  nl2sql_pipeline:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false
  
  # 工作流日志记录器
  nl2sql_pipeline.workflows:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  # 管道日志记录器
  nl2sql_pipeline.pipelines:
    level: DEBUG
    handlers: [file]
    propagate: false
  
  # 服务日志记录器
  nl2sql_pipeline.services:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  # 第三方库日志记录器
  langchain:
    level: WARNING
    handlers: [file]
    propagate: false
  
  urllib3:
    level: WARNING
    handlers: [file]
    propagate: false
  
  pymysql:
    level: WARNING
    handlers: [file]
    propagate: false