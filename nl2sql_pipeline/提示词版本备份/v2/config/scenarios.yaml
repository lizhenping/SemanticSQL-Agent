# 场景配置 - 层次化结构
# 注意：不包含表信息，表映射在后续阶段处理

scenarios:
  # 一、合同承担情况场景
  contract_undertaking_situation:
    name: "合同承担情况"
    description: "分析装备采购合同的数量分布、类型结构和承担主体情况"
    weight: 0.35  # 在所有场景中的权重
    type: "analysis"  # 场景类型，用于匹配复杂度分布
    
    sub_scenarios:
      contract_quantity_distribution:
        name: "合同数量分布分析"
        weight: 0.4  # 在大场景内的权重
        focus_areas:
          - "全军装备采购合同总数统计及历年对比"
          - "新签合同与历史合同数量分析"
          - "大额合同（一亿元以上）数量统计"
          - "合同数量季度及年度变化趋势"
        
      contract_type_structure:
        name: "合同类型结构分析"
        weight: 0.35
        focus_areas:
          - "研制、订购、维修、服务保障合同分布"
          - "陆军、海军、空军等装备类型合同分布"
          - "合同类型与装备类型交叉分析"
          - "不同类型合同规模结构分析"
          
      contractor_undertaking:
        name: "承制主体承担分析"
        weight: 0.25
        focus_areas:
          - "各军工集团合同承担数量排名"
          - "承制单位合同承担能力分析"
          - "重要合同承制主体分布情况"
          - "承制单位专业领域集中度分析"

  # 二、合同履行状态场景
  contract_fulfillment_status:
    name: "合同履行状态"
    description: "监控合同履行的整体态势和红黄绿状态分布"
    weight: 0.40
    type: "monitoring"
    
    sub_scenarios:
      fulfillment_status_distribution:
        name: "履行状态分布监控"
        weight: 0.5
        focus_areas:
          - "红黄绿合同数量及占比统计"
          - "风险合同（红色+黄色）总体占比分析"
          - "不同合同类型履行状态对比"
          - "不同装备类型履行状态差异分析"
        
      important_contract_monitoring:
        name: "重要合同履行监控"
        weight: 0.3
        focus_areas:
          - "重要合同总数及监管经费占比"
          - "重要合同风险分布专项分析"
          - "重要合同与一般合同履行状态对比"
          - "重要合同关键节点履行跟踪"
          
      status_trend_analysis:
        name: "履行状态趋势分析"
        weight: 0.2
        focus_areas:
          - "2018年以来风险合同占比变化趋势"
          - "合同履行状态季度变化分析"
          - "履行状态改善与恶化合同统计"
          - "重要合同状态变化专项跟踪"

  # 三、影响合同履行的主要因素场景
  main_factors_affecting_fulfillment:
    name: "影响合同履行的主要因素"
    description: "识别分析影响合同履行的关键风险因素和质量问题"
    weight: 0.25
    type: "analysis"
    
    sub_scenarios:
      risk_factor_analysis:
        name: "风险因素排序分析"
        weight: 0.5
        focus_areas:
          - "影响合同履行主要原因排序统计"
          - "不同风险因素影响合同数量分析"
          - "风险因素与合同类型关联性分析"
          - "高频风险因素集中度分析"
        
      factor_evolution_trends:
        name: "因素演变趋势分析"
        weight: 0.3
        focus_areas:
          - "2017-2020年主要影响因素变化对比"
          - "新兴风险因素识别与跟踪"
          - "传统风险因素影响程度变化"
          - "外部环境因素影响评估"
          
      quality_issue_analysis:
        name: "质量问题因素分析"
        weight: 0.2
        focus_areas:
          - "质量问题分级统计（一般、严重、重大）"
          - "质量问题归零情况跟踪分析"
          - "质量问题涉及合同及承制单位分布"
          - "研制生产阶段与使用阶段质量问题关联"

# 场景配置元数据
metadata:
  total_scenarios: 3
  total_sub_scenarios: 9
  scenario_types:
    monitoring: ["contract_fulfillment_status"]
    analysis: ["contract_undertaking_situation", "main_factors_affecting_fulfillment"]
    reporting: []  # 可扩展