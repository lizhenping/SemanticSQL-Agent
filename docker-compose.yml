services:
  semanticsql:
    build: .
    container_name: semanticsql-agent
    volumes:
      # 数据集只读挂载（相对 docker-compose.yml 所在目录，可移植）
      - ./datasets:/data:ro
      # 生成产物持久化（data-assets/ 与 docker-compose.yml 同级，被 gitignore）
      - ./data-assets:/app/history
    environment:
      # OpenAI-compatible Ling API 配置（值来自项目根目录 .env）
      SEMANTICSQL_LLM_MODEL: ${OPENAI_MODEL:-Ling-3.0-flash}
      SEMANTICSQL_LLM_BASE_URL: ${OPENAI_BASE_URL:-https://api.ant-ling.com/v1/}
      SEMANTICSQL_LLM_API_KEY: ${OPENAI_API_KEY:?请在 .env 中设置 OPENAI_API_KEY}
      SEMANTICSQL_LLM_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.1}
      SEMANTICSQL_LLM_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-8000}
      # 思考模式开关（Qwen3 系思考模型可关掉推理输出，省 token 提速）
      SEMANTICSQL_LLM_ENABLE_THINKING: ${OPENAI_ENABLE_THINKING:-true}
      # 数据库根目录指向挂载的数据集
      SEMANTICSQL_DB_TYPE: sqlite
      SEMANTICSQL_DB_ROOT: /data
    # 默认跑 help；实际命令用 docker compose run 传参
    command: ["--help"]
