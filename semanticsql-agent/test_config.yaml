agent:
  enable_reflection: true
  enable_thinking: true
  enable_trajectory: true
  enabled_tools:
  - schema_extraction
  - domain_analysis
  - field_classification
  - er_analysis
  - sql_generation
  - sql_validation
  - sql_execution
  - sequential_thinking
  max_steps: 10
  name: SemanticSQLAgent
  verbose: true
app_name: SemanticSQLAgent
app_version: 2.0.0
config_dir: config
data_dir: data
database:
  charset: utf8mb4
  database: testdb
  host: 192.168.200.216
  max_overflow: 10
  password: testpass
  pool_size: 5
  port: 13306
  sample_rows_in_table_info: 3
  type: mysql
  username: testuser
environment: development
llm:
  api_key: not-needed
  base_url: http://192.168.200.216:9009/v1
  max_retries: 3
  max_tokens: 20000
  model: Qwen3-14B
  temperature: 0.1
  timeout: 30
logging:
  backup_count: 5
  file_path: logs/semanticsql.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_file_size: 10485760
logs_dir: logs
trajectory:
  compress_old: true
  directory: trajectories
  enabled: true
  include_llm_calls: true
  include_tool_calls: true
  max_trajectories: 100
