# PostgreSQL 数据库配置示例

agent:
  # 模型配置
  model:
    model: "gpt-4-turbo-preview"
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
    temperature: 0.1
    max_tokens: 2000
  
  # 执行配置
  max_steps: 15
  verbose: false
  save_trajectory: true
  
  # 工具配置 - 可以选择性启用工具
  tools:
    - "schema_extraction"
    - "domain_analysis"
    - "sql_generation"
    - "sql_validation"
    # - "sql_execution"  # 可以注释掉不执行
  
  enable_thinking_tool: true
  enable_reflection: false
  
  # PostgreSQL 数据库配置
  database:
    type: "postgresql"
    host: "localhost"
    port: 5432
    database: "analytics_db"
    username: "postgres"
    password: "${DB_PASSWORD}"  # 从环境变量读取
  
  # SQL 特定配置
  max_query_results: 1000
  enable_query_cache: false
  cache_ttl: 7200