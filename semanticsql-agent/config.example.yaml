# SemanticSQL Agent 配置文件示例
# 复制此文件为 config.yaml 并根据需要修改

settings:
  # LLM 配置
  llm_model: "Qwen3-14B"
  llm_base_url: "http://127.0.0.1:9991/v1"
  llm_api_key: "not-needed"
  llm_temperature: 0.7
  llm_max_tokens: 20000
  llm_timeout: 30
  
  # Agent 配置
  max_steps: 15
  max_iterations: 20
  enable_reflection: true
  enable_trajectory: true
  verbose: true
  
  # 启用的工具
  enabled_tools:
    - "schema_extraction"
    - "domain_analysis"
    - "field_classification"
    - "column_meaning_analysis"
    - "table_meaning_analysis"
    - "er_analysis"
    - "scenario_tool"
    - "operation_selection"
    - "question_generation"
    - "sql_generation"
    - "sql_validation"
    - "sql_execution"
    - "sql_reflection"
    - "sequential_thinking"

database:
  # MySQL 连接配置
  host: "192.168.200.216"
  port: 13306
  database: "testdb"
  username: "testuser"
  password: "testpass"
  
  # 连接池配置
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  
  # 其他设置
  echo: false  # 是否打印 SQL 语句
  sample_rows_in_table_info: 3

generation:
  # 生成配置
  validation_enabled: true
  max_retries: 3
  batch_size: 10
  
# 轨迹记录配置
trajectory:
  enabled: true
  save_path: "./trajectories"
  format: "json"